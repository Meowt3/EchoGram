name: Build EchoGram APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias echogram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass echogram_release_store \
            -keypass echogram_release_store \
            -dname "CN=EchoGram, OU=Android, O=Meowt3, C=RU"

      - name: Build Release & Debug APKs
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: echogram_release_store
          RELEASE_KEY_ALIAS: echogram
          RELEASE_KEY_PASSWORD: echogram_release_store
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/EchoGram-v2.1.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/EchoGram-v2.1.0-debug.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoGram-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EchoGram-v2.1.0-release.apk
            dist/EchoGram-v2.1.0-debug.apk
          generate_release_notes: true
